name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run check
      - run: npm test
      - run: npx wrangler deploy --dry-run
      - name: bundle freshness
        run: |
          npm run bundle || echo "bundle failed (network optional)"
          git diff --exit-code -- src/assets/bundled.ts || echo "::warning::bundled assets drift — run npm run bundle"
      - name: commitlint (conventional commits)
        if: github.event_name == 'pull_request'
        run: npx commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.event.pull_request.head.sha }} --verbose
      - name: commitlint (push)
        if: github.event_name == 'push'
        run: npx commitlint --from=HEAD~1 --to=HEAD --verbose || npx commitlint --from=origin/main~1 --to=HEAD --verbose || echo "::warning::commitlint skipped (shallow)"

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: semantic-release (dry-run on PR, publish on main)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
