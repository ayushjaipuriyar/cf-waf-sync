name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run lint:check
      - run: pnpm test
      - run: pnpm exec wrangler deploy --dry-run
      - name: bundle freshness
        run: |
          pnpm run bundle || echo "bundle failed (network optional)"
          git diff --exit-code -- src/assets/bundled.ts || echo "::warning::bundled assets drift — run pnpm run bundle"
      - name: commitlint (conventional commits)
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.event.pull_request.head.sha }} --verbose
      - name: commitlint (push)
        if: github.event_name == 'push'
        run: pnpm exec commitlint --from=HEAD~1 --to=HEAD --verbose || pnpm exec commitlint --from=origin/main~1 --to=HEAD --verbose || echo "::warning::commitlint skipped (shallow)"

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: semantic-release (publish on main)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
